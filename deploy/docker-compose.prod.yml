name: termo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${ECR_BACKEND:?infra.env nao carregado}:${IMAGE_TAG:?defina IMAGE_TAG}
    env_file:
      - /opt/termo/infra.env
      - /opt/termo/segredos.env
    environment:
      DB_SSLMODE: require
      LOG_LEVEL: INFO
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  frontend:
    image: ${ECR_FRONTEND:?infra.env nao carregado}:${IMAGE_TAG:?defina IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
