name: termo-teste

services:
  postgres-teste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: termo_teste
      POSTGRES_USER: termo
      POSTGRES_PASSWORD: termo
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termo -d termo_teste"]
      interval: 3s
      timeout: 3s
      retries: 20
