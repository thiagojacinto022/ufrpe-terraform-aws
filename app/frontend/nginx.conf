log_format json escape=json
    '{"timestamp":"$time_iso8601","level":"info","logger":"nginx",'
    '"message":"requisicao","metodo":"$request_method","caminho":"$uri",'
    '"status":$status,"duracao_s":$request_time,"bytes":$body_bytes_sent,'
    '"id_requisicao":"$request_id","ip_cliente":"$http_x_forwarded_for",'
    '"agente":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log json;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    location = /metrics {
        return 404;
    }

    location = /health {
        access_log off;
        proxy_pass $backend;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
